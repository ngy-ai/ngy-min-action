[package]
name = "ngy-min-action"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
anyhow = "1"
caseless = "0.2"
chrono = { version = "0.4", features = ["clock"] }
eframe = "0.37"
egui_extras = { version = "0.37", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
ngy-utils-tracing = "0.7"
rfd = "0.17"
rusqlite = { version = "0.41", features = ["backup", "bundled"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "time", "sync"] }
tracing = "0.1"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "plan_day"
harness = false
