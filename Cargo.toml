[package]
name = "ngy-min-action"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
eframe = "0.37"
ngy-utils-tracing = "0.7"
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "time", "sync"] }
tracing = "0.1"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "plan_day"
harness = false
